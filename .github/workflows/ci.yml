name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ntfscore-test:
    name: NTFSCore (swift test)
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/NTFSCore
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.3+
        run: |
          set -e
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.3.app/Contents/Developer
          else
            echo "::warning::Xcode_16.3.app not present on runner; falling back to default Xcode.app"
            sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Verify FSKit SDK is present
        run: |
          test -d "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/FSKit.framework" || {
            echo "::error::FSKit.framework not in SDK $(xcrun --sdk macosx --show-sdk-path)"
            exit 1
          }
          xcrun --sdk macosx --show-sdk-platform-version

      - name: Show Swift version
        run: swift --version

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  fskit-extension-build:
    name: FSKit extension + containing app (xcodebuild)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.3+
        run: |
          set -e
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.3.app/Contents/Developer
          else
            echo "::warning::Xcode_16.3.app not present on runner; falling back to default Xcode.app"
            sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Verify FSKit SDK is present
        run: |
          test -d "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/FSKit.framework" || {
            echo "::error::FSKit.framework not in SDK $(xcrun --sdk macosx --show-sdk-path)"
            exit 1
          }

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Regenerate Xcode project from project.yml
        run: xcodegen generate

      - name: Build NTFSFileSystem (system extension)
        run: |
          xcodebuild -project NTFSMountManager.xcodeproj \
            -scheme NTFSFileSystem \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/Xcode \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build NTFSMountManager (containing app)
        run: |
          xcodebuild -project NTFSMountManager.xcodeproj \
            -scheme NTFSMountManager \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/Xcode \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build ntfsctl (CLI)
        run: |
          xcodebuild -project NTFSMountManager.xcodeproj \
            -scheme ntfsctl \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/Xcode \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  ntfsctl-test:
    name: ntfsctl smoke (swift run against fixture)
    runs-on: macos-15
    defaults:
      run:
        working-directory: Tools/ntfsctl
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.3+
        run: |
          set -e
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.3.app/Contents/Developer
          else
            sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          fi

      - name: swift build
        run: swift build

      - name: ntfsctl info on the committed fixture
        run: |
          .build/debug/ntfsctl info ../../Packages/NTFSCore/Tests/NTFSCoreTests/Fixtures/small.img
          .build/debug/ntfsctl list ../../Packages/NTFSCore/Tests/NTFSCoreTests/Fixtures/small.img
          .build/debug/ntfsctl verify ../../Packages/NTFSCore/Tests/NTFSCoreTests/Fixtures/small.img
