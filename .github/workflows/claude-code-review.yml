name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Collapse rapid-fire pushes to the same PR into a single review of the latest
# state: a new run cancels any in-flight review for the same PR. `synchronize`
# is deliberately KEPT in the trigger list above so each pushed fix round gets a
# fresh review — without it only the first push is ever reviewed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write`, not `read` — posting the review comment is a write operation.
      # Matches the known-working setup in this account (vendsy/hub).
      pull-requests: write
      # Also `write`: a PR comment IS an issue comment in the GitHub API, so
      # posting one requires issues:write, not issues:read.
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: a depth-1 shallow clone cannot resolve the PR base SHA, so
          # the reviewer cannot run `git show <base>:<path>` to check pre-PR state
          # and reports "shallow clone, could not verify" instead of reviewing.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is REQUIRED to actually post. Without it the command runs a
          # full review (21 turns, ~$0.50 on PR #51) and then posts nothing, while
          # the workflow still reports success. vendsy/hub passes it; this did not.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

