# xcodegen spec — generates Apps/NTFSMountManager.xcodeproj.
#
# Regenerate any time targets change:
#   brew install xcodegen   # if not already installed
#   xcodegen generate
#
# CI runs `xcodebuild build` against the generated project; the .xcodeproj is
# committed for convenience but project.yml is the source of truth.

name: NTFSMountManager
options:
  bundleIdPrefix: com.ntfs-tool
  deploymentTarget:
    macOS: "15.4"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "16.3"
  groupOrdering:
    - order: [Apps, Extensions, Packages, scripts, Tests]

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""    # set per machine before running on hardware
    CODE_SIGN_IDENTITY: "-" # ad-hoc for CI builds

packages:
  NTFSCore:
    path: Packages/NTFSCore
  NTFSUIKit:
    path: Packages/NTFSUIKit
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.3.0"

projectReferences: {}

targets:

  NTFSMountManager:
    type: application
    platform: macOS
    sources:
      - path: Apps/NTFSMountManager/Sources
      # The shared XPC protocol + DTOs are compiled into BOTH the app and the
      # helper daemon. It lives under the helper's Sources dir; reference the
      # single file here so the app can talk to the daemon without a separate
      # framework.
      - path: Extensions/NTFSPrivilegedHelper/Sources/NTFSHelperProtocol.swift
      # SMAppService reads the LaunchDaemon plist from
      # Contents/Library/LaunchDaemons/. Copy it there via a copyFiles build
      # phase whose destination is the bundle wrapper + that subpath.
      - path: Extensions/NTFSPrivilegedHelper/com.ntfs-tool.NTFSMountManager.PrivilegedHelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Apps/NTFSMountManager/Info.plist
      properties:
        LSMinimumSystemVersion: "15.4"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.NTFSMountManager
        CODE_SIGN_ENTITLEMENTS: Apps/NTFSMountManager/NTFSMountManager.entitlements
        INFOPLIST_KEY_LSUIElement: NO
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - package: NTFSUIKit
        product: NTFSUIKit
      - target: NTFSFileSystem
        embed: true
        codeSign: true
      # The privileged helper daemon travels inside the app bundle. SMAppService
      # requires the daemon executable at Contents/MacOS/<name> (matching
      # BundleProgram in the plist). `copy` with destination `executables`
      # places the built tool product there and code-signs it with the app.
      - target: NTFSPrivilegedHelper
        embed: true
        codeSign: true
        copy:
          destination: executables      # -> Contents/MacOS
          subpath: ""

  NTFSFileSystem:
    type: system-extension
    platform: macOS
    sources:
      - path: Extensions/NTFSFileSystem/Sources
    info:
      path: Extensions/NTFSFileSystem/Info.plist
      properties:
        CFBundlePackageType: "XPC!"
        LSMinimumSystemVersion: "15.4"
        FSShortName: "NTFS (Phase 2)"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
        FSPersonalities:
          NTFS:
            FSName: ntfs
            FSSubType: 0
            FSFormatSubType: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.NTFSMountManager.NTFSFileSystem
        CODE_SIGN_ENTITLEMENTS: Extensions/NTFSFileSystem/NTFSFileSystem.entitlements
        SWIFT_OPTIMIZATION_LEVEL: -Onone
        # FSKit's Obj-C surface predates Swift 6 strict concurrency. Relax
        # the project-wide setting for this target so callback handlers
        # capturing FSResource references compile cleanly. The protocol
        # itself uses @Sendable on reply handlers, so the relaxation is
        # bounded.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5"
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - sdk: FSKit.framework

  NTFSPrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: Extensions/NTFSPrivilegedHelper/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.NTFSMountManager.PrivilegedHelper
        # SMAppService requires the daemon executable's name to match the
        # BundleProgram path in the plist (Contents/MacOS/NTFSPrivilegedHelper).
        PRODUCT_NAME: NTFSPrivilegedHelper
        # The XPC / Security C interop (audit tokens, SecCode) predates Swift 6
        # strict concurrency; mirror the FSKit target's relaxation so the
        # code-signature gate compiles cleanly. App + NTFSUIKit stay complete.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: NTFSCore
        product: NTFSCore

  ntfsctl:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ntfsctl/Sources/ntfsctl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.ntfsctl
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5"
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - package: SwiftArgumentParser
        product: ArgumentParser
