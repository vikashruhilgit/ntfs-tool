# xcodegen spec — generates Apps/NTFSMountManager.xcodeproj.
#
# Regenerate any time targets change:
#   brew install xcodegen   # if not already installed
#   xcodegen generate
#
# CI runs `xcodebuild build` against the generated project; the .xcodeproj is
# committed for convenience but project.yml is the source of truth.

name: NTFSMountManager
options:
  bundleIdPrefix: com.ntfs-tool
  deploymentTarget:
    macOS: "15.4"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "16.3"
  groupOrdering:
    - order: [Apps, Extensions, Packages, scripts, Tests]

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""    # set per machine before running on hardware
    CODE_SIGN_IDENTITY: "-" # ad-hoc for CI builds

packages:
  NTFSCore:
    path: Packages/NTFSCore
  NTFSUIKit:
    path: Packages/NTFSUIKit
  NTFSOps:
    path: Packages/NTFSOps
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.3.0"

projectReferences: {}

targets:

  NTFSMountManager:
    type: application
    platform: macOS
    sources:
      - path: Apps/NTFSMountManager/Sources
    info:
      path: Apps/NTFSMountManager/Info.plist
      properties:
        LSMinimumSystemVersion: "15.4"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.NTFSMountManager
        CODE_SIGN_ENTITLEMENTS: Apps/NTFSMountManager/NTFSMountManager.entitlements
        INFOPLIST_KEY_LSUIElement: NO
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - package: NTFSUIKit
        product: NTFSUIKit
      - package: NTFSOps
        product: NTFSOps
      - target: NTFSFileSystem
        embed: true
        codeSign: true

  NTFSFileSystem:
    # ExtensionKit app extension, NOT a system-extension. FSKit modules
    # declare EXAppExtensionAttributes / EXExtensionPointIdentifier
    # (com.apple.fskit.fsmodule) and are packaged as `.appex` in the app's
    # Contents/Extensions -- macOS discovers them when the containing app is
    # installed and the user enables them in System Settings > General >
    # Login Items & Extensions. Built as `system-extension` the bundle landed
    # in Contents/Library/SystemExtensions and OSSystemExtensionManager
    # rejected activation with "Extension not found in App bundle. Unable to
    # find any matched extension with identifier: ..." -- accurate, since it
    # searches for a SYSX-style system extension and ours is an app extension.
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extensions/NTFSFileSystem/Sources
    info:
      path: Extensions/NTFSFileSystem/Info.plist
      properties:
        CFBundlePackageType: "XPC!"
        LSMinimumSystemVersion: "15.4"
        # FSKit reads FSPersonalities / FSShortName from INSIDE
        # EXAppExtensionAttributes, not from the top level of the Info.plist.
        # Declared at top level they are invisible to fskit_agent, so the
        # module advertises no personalities and `mount -F -t ntfs_tool`
        # fails with "Unable to invoke task" -- there is no task to invoke
        # because nothing named ntfs_tool exists. Verified by diffing against
        # Apple's own module at
        # /System/Library/ExtensionKit/Extensions/com.apple.fskit.exfat.appex,
        # which nests all of these.
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          # FSShortName is the `mount -t` TYPE TOKEN, not a display string:
          # Apple's own modules use "exfat" / "msdos" / "ftp" here, matching
          # `mount -t exfat`. FSName is the user-visible personality name
          # ("ExFAT", "MS-DOS (FAT)"). We had the two swapped, so
          # `mount -F -t ntfs_tool` searched for a short name that did not
          # exist while ours was "NTFS (ntfs-tool)" -- spaces and parentheses,
          # unusable as a type token. Hence "Unable to invoke task".
          #
          # "ntfs_tool" deliberately avoids "ntfs", which Apple's legacy
          # driver at /System/Library/Filesystems/ntfs.fs already claims --
          # a collision would make it ambiguous which driver mounted a volume,
          # the exact question this gate exists to answer.
          FSShortName: "ntfs_tool"
          # We operate on a block device (/dev/diskNsM), not a network URL.
          FSSupportsBlockResources: true
          FSSupportsServerURLs: false
          FSPersonalities:
            NTFS:
              # User-visible personality name (what diskutil shows), NOT the
              # mount token -- that is FSShortName above.
              FSName: "NTFS (ntfs-tool)"
              FSSubType: 0
              FSFormatSubType: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.NTFSMountManager.NTFSFileSystem
        CODE_SIGN_ENTITLEMENTS: Extensions/NTFSFileSystem/NTFSFileSystem.entitlements
        SWIFT_OPTIMIZATION_LEVEL: -Onone
        # FSKit's Obj-C surface predates Swift 6 strict concurrency. Relax
        # the project-wide setting for this target so callback handlers
        # capturing FSResource references compile cleanly. The protocol
        # itself uses @Sendable on reply handlers, so the relaxation is
        # bounded.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5"
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - sdk: FSKit.framework

  ntfsctl:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ntfsctl/Sources/ntfsctl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntfs-tool.ntfsctl
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5"
    dependencies:
      - package: NTFSCore
        product: NTFSCore
      - package: SwiftArgumentParser
        product: ArgumentParser
